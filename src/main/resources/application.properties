spring.application.name=Reelify

# Cassandra
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.keyspace-name=reelify
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=create-if-not-exists

# MinIO
minio.endpoint=http://192.168.1.9:19000
minio.access-key=plane_minio_access
minio.secret-key=plane_minio_s3cr3t_key
minio.bucket=reelify

# File upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Kafka Producer
#The address of the Kafka broker
#The message key is videoId — a String. StringSerializer converts it to bytes for Kafka
#VideoUploadedEvent — a Java object. JsonSerializer converts it to JSON bytes:

spring.kafka.bootstrap-servers=localhost:9092              
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer         
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer