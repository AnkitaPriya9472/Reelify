_format_version: "3.0"
_transform: true

services:
  - name: reelify-service
    url: http://host.docker.internal:8080
    routes:
      - name: videos-route
        paths:
          - /videos
        strip_path: false

  - name: keycloak-service              # NEW — auth traffic goes here
    url: http://keycloak:8080
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

plugins:
  - name: jwt                           # NEW — protects /videos only
    service: reelify-service            # only applied to this service
    config:
      claims_to_verify:
        - exp                           # reject expired tokens

  - name: cors
    config:
      origins:
        - http://localhost:4200
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      policy: local